---
- name: DNS update proxmox hosts
  hosts: proxmoxs
  become: true


  tasks: 
    - name: search update
      lineinfile: 
        path: /etc/resolv.conf
        regexp: '^search'
        line: 'search lab.internal'

    - name: namespace update
      lineinfile:
        path: /etc/resolv.conf
        regexp: '^nameserver'
        line: 'nameserver 192.168.10.200'
