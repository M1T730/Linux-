---
- name: Install Node Exporter on all hosts
  hosts: all
  become: true

  tasks: 
    - name: Download Node Exporter 
      get_url:
        url: https://github.com/prometheus/node_exporter/releases/download/v1.10.2/node_exporter-1.10.2.linux-amd64.tar.gz
        dest: /tmp/node_exporter.tar.gz
  
    - name: Extract Node Exporter
      unarchive:
        src: /tmp/node_exporter.tar.gz
        dest: /tmp
        remote_src: yes 
    
    - name: Move Node Exporter binary to /usr/local/bin
      copy:
        src: /tmp/node_exporter-1.10.2.linux-amd64/node_exporter
        dest: /usr/local/bin/node_exporter
        mode: '0755'
    
    - name: Create node_exporter user
      user:
        name: node_exporter
        shell: /usr/sbin/nologin
        system: true

    - name: Create systemd service file for Node Exporter
      copy:
        dest: /etc/systemd/system/node_exporter.service
        content: |
          [Unit]
          Description=Node Exporter
          After=network.target

          [Service]
          User=node_exporter
          ExecStart=/usr/local/bin/node_exporter

          [Install]
          WantedBy=multi-user.target

    - name: Enable and start Node Exporter service
      systemd:
        name: node_exporter
        enabled: true
        state: started