---
- name: Install Promtrail on all hosts
  hosts: all
  become: true
  
  vars_files:
    - ../vars.yml
  
  tasks: 
    - name: Download Promtail 
      get_url:
        url: https://github.com/grafana/loki/releases/download/v3.6.0/promtail-linux-amd64.zip
        dest: /tmp/promtail.zip
  
    - name: Extract Promtail
      unarchive:
        src: /tmp/promtail.zip
        dest: /tmp
        remote_src: yes 
    
    - name: Move Promtail binary to /usr/local/bin
      copy:
        src: /tmp/promtail-linux-amd64
        dest: /usr/local/bin/promtail
        mode: '0755'
        remote_src: true
    
    - name: Create promtail user
      user:
        name: promtail
        shell: /usr/sbin/nologin
        system: true

    - name: Add promtail to systemd-journal group
      user:
        name: promtail
        groups: systemd-journal
        append: true

    - name: Create promtail directories
      file:
        path: "{{ item }}"
        state: directory
        owner: promtail
        group: promtail
        mode: '0755'
      loop:
        - /var/lib/promtail
        - /etc/promtail

    - name: Create Promtail config
      copy:
        dest: /etc/promtail/promtail.yml
        owner: root
        group: root
        mode: '0644'
        content: |
          server:
            http_listen_port: 9080

          clients:
            - url: {{ loki_url }}

          positions:
            filename: /var/lib/promtail/positions.yaml

          scrape_configs:
            - job_name: systemd-journal
              journal:
                max_age: 12h
                labels:
                  job: systemd-journal
                  host: {{ inventory_hostname }}

              relabel_configs:
                - source_labels: ['__journal__systemd_unit']
                  target_label: unit

                - source_labels: ['__journal__hostname']
                  target_label: host

    - name: Create systemd service for Promtail
      copy:
        dest: /etc/systemd/system/promtail.service
        content: |
          [Unit]
          Description=Promtail
          After=network.target

          [Service]
          User=promtail
          Group=systemd-journal
          ExecStart=/usr/local/bin/promtail -config.file=/etc/promtail/promtail.yml
          Restart=always

          [Install]
          WantedBy=multi-user.target

    - name: Enable and start Promtail service
      systemd:
        name: promtail
        enabled: true
        state: started