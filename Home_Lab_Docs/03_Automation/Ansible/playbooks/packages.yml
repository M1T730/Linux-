---
- name: Install default packages on all hosts 
  hosts: all
  become: true

  tasks: 
    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Install packages
      apt:
        name: "{{ item }}"
        state: present
      loop:
        - curl
        - vim
        - htop
        - wget
        - sudo 
        - ssh
        - unzip
   
